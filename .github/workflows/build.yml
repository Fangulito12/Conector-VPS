name: Build y firma APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK sin firmar
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Preparar y validar clave y certificado
        env:
          KEY_B64: ${{ secrets.KEY_PK8_B64 }}
          CERT_B64: ${{ secrets.CERT_PEM_B64 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"

          # Decodificar (tr elimina saltos de línea, espacios y CR por si acaso)
          echo "$KEY_B64"  | tr -d ' \r\n' | base64 -d > key.raw
          echo "$CERT_B64" | tr -d ' \r\n' | base64 -d > cert.raw

          echo "== Tipo de archivos =="
          file key.raw cert.raw
          echo "== Cabeceras PEM (si las hay) =="
          echo "-- key.raw:";  grep -a "BEGIN\|END" key.raw  || echo "(binario/DER)"
          echo "-- cert.raw:"; grep -a "BEGIN\|END" cert.raw || echo "(binario/DER)"

          # Detectar secretos intercambiados
          if grep -aq "BEGIN CERTIFICATE" key.raw && ! grep -aq "PRIVATE KEY" key.raw; then
            echo "ERROR: el secreto de la CLAVE contiene un certificado. Los secretos están intercambiados."; exit 1
          fi
          if grep -aq "PRIVATE KEY" cert.raw; then
            echo "ERROR: el secreto del CERTIFICADO contiene una clave privada (¿intercambiados o archivo combinado?)."; exit 1
          fi

          # Clave -> PKCS#8 DER sin cifrar (acepta PEM o DER de entrada)
          if grep -aq "BEGIN" key.raw; then
            openssl pkcs8 -topk8 -nocrypt -inform PEM -outform DER -in key.raw -out key.pk8
          else
            openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in key.raw -out key.pk8
          fi

          # Certificado -> PEM limpio (acepta PEM o DER de entrada)
          if grep -aq "BEGIN CERTIFICATE" cert.raw; then
            openssl x509 -in cert.raw -out cert.pem
          else
            openssl x509 -inform DER -in cert.raw -out cert.pem
          fi

          echo "== Info del certificado =="
          openssl x509 -in cert.pem
