name: Build y firma APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir proyecto
        run: |
          set -eo pipefail
          unzip -q proyecto.zip -d src_proyecto
          echo "== Primeros niveles del zip =="
          find src_proyecto -maxdepth 3 | head -60
          echo "== Archivos clave =="
          find src_proyecto \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \
            -o -name build.gradle -o -name build.gradle.kts -o -name pubspec.yaml \
            -o -name config.xml -o -name package.json -o -name "*.apk" -o -name "*.aia" \) \
            -not -path "*/node_modules/*" | head -40

      - name: Compilar APK sin firmar
        run: |
          set -eo pipefail
          SETTINGS=$(find src_proyecto \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no hay settings.gradle en el zip, así que no es un proyecto Gradle/Android nativo."
            echo "Revisá la lista de archivos del paso anterior."; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "$DIR" > "$RUNNER_TEMP/projdir.txt"
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Preparar y validar clave y certificado
        env:
          KEY_B64: ${{ secrets.KEY_PK8_B64 }}
          CERT_B64: ${{ secrets.CERT_PEM_B64 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"

          echo "$KEY_B64"  | tr -d ' \r\n' | base64 -d > key.raw
          echo "$CERT_B64" | tr -d ' \r\n' | base64 -d > cert.raw

          echo "== Tipo de archivos =="
          file key.raw cert.raw
          echo "-- key.raw:";  grep -a "BEGIN\|END" key.raw  || echo "(binario/DER)"
          echo "-- cert.raw:"; grep -a "BEGIN\|END" cert.raw || echo "(binario/DER)"

          if grep -aq "BEGIN CERTIFICATE" key.raw && ! grep -aq "PRIVATE KEY" key.raw; then
            echo "ERROR: el secreto de la CLAVE contiene un certificado. Los secretos están intercambiados."; exit 1
          fi
          if grep -aq "PRIVATE KEY" cert.raw; then
            echo "ERROR: el secreto del CERTIFICADO contiene una clave privada (¿intercambiados o archivo combinado?)."; exit 1
          fi

          if grep -aq "BEGIN" key.raw; then
            openssl pkcs8 -topk8 -nocrypt -inform PEM -outform DER -in key.raw -out key.pk8
          else
            openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in key.raw -out key.pk8
          fi

          if grep -aq "BEGIN CERTIFICATE" cert.raw; then
            openssl x509 -in cert.raw -out cert.pem
          else
            openssl x509 -inform DER -in cert.raw -out cert.pem
          fi

          openssl x509 -in cert.pem -noout -subject -enddate
          openssl pkey -inform DER -in key.pk8 -text -noout | head -1

          K=$(openssl pkey -inform DER -in key.pk8 -pubout -outform DER | sha256sum)
          C=$(openssl x509 -in cert.pem -pubkey -noout | openssl pkey -pubin -pubout -outform DER | sha256sum)
          [ "$K" = "$C" ] && echo "Clave y certificado COINCIDEN" || { echo "ERROR: no coinciden"; exit 1; }

          rm -f key.raw cert.raw

      - name: Alinear y firmar APK
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          DIR=$(cat "$RUNNER_TEMP/projdir.txt")
          UNSIGNED=$(find "$DIR" -path "*outputs/apk/release*" -name "*.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "ERROR: no se encontró ningún APK de release."
            find "$DIR" -name "*.apk"; exit 1
          fi
          echo "APK sin firmar: $UNSIGNED"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --key "$RUNNER_TEMP/key.pk8" \
            --cert "$RUNNER_TEMP/cert.pem" \
            --out app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify --verbose app-release-signed.apk

      - name: Limpiar claves
        if: always()
        run: rm -f "$RUNNER_TEMP"/key.pk8 "$RUNNER_TEMP"/cert.pem

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: apk-firmado
          path: app-release-signed.apk
