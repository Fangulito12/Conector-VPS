name: Build y firma APK

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar Release (opcional)"
        type: boolean
        default: false
      notas:
        description: "Novedades de esta versión (salen en el aviso de actualización de la app)"
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir proyecto
        run: |
          set -eo pipefail
          unzip -q proyecto.zip -d src_proyecto
          find src_proyecto -maxdepth 3 | head -40

      - name: Verificar librerías nativas del proyecto
        run: |
          set -eo pipefail
          echo "== jniLibs =="
          find src_proyecto -path "*jniLibs*" -name "*.so" | sort
          find src_proyecto -path "*jniLibs*" -name "libhev-socks5-tunnel.so" | grep -q . \
            || { echo "ERROR: el proyecto.zip no trae los .so. Subí el proyecto.zip preparado."; exit 1; }
          echo "== Restos de build nativo (debe quedar vacío) =="
          grep -rnE "externalNativeBuild|ndkBuild|ndkVersion" --include=build.gradle src_proyecto || echo "(ninguno)"

      - name: Compilar APK (debug con R8, como tu build original)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PORTS: ${{ secrets.SERVER_PORTS }}
          UDPGW_PORT: ${{ secrets.UDPGW_PORT }}
          AI_PORT: ${{ secrets.AI_PORT }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TLS: ${{ secrets.TLS }}
          TLS_SNI: ${{ secrets.TLS_SNI }}
          IPV6: ${{ secrets.IPV6 }}
          APP_SUFFIX: ${{ secrets.APP_SUFFIX }}
        run: |
          set -eo pipefail
          SETTINGS=$(find src_proyecto \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          [ -n "$SETTINGS" ] || { echo "ERROR: no hay settings.gradle"; exit 1; }
          DIR=$(dirname "$SETTINGS")
          echo "$DIR" > "$RUNNER_TEMP/projdir.txt"
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Verificar APK compilado
        run: |
          set -eo pipefail
          DIR=$(cat "$RUNNER_TEMP/projdir.txt")
          NEW=$(find "$DIR" -path "*outputs/apk/debug*" -name "*.apk" | head -1)
          [ -n "$NEW" ] || { echo "ERROR: no se encontró el APK debug"; find "$DIR" -name "*.apk"; exit 1; }
          NEW=$(realpath "$NEW")
          echo "$NEW" > "$RUNNER_TEMP/newapk.txt"
          echo "APK: $NEW"
          echo "== .so =="
          unzip -l "$NEW" | awk '{print $4}' | grep '\.so$' | sort | tee "$RUNNER_TEMP/so.txt"
          grep -q "libhev-socks5-tunnel.so" "$RUNNER_TEMP/so.txt" \
            || { echo "ERROR: el APK no trae libhev-socks5-tunnel.so"; exit 1; }
          echo "== R8 respetó TProxyService? =="
          FOUND=0
          for d in $(unzip -l "$NEW" | awk '{print $4}' | grep -E '^classes.*\.dex$'); do
            if unzip -p "$NEW" "$d" | strings | grep -q "TProxyStartService"; then FOUND=1; fi
          done
          [ "$FOUND" = 1 ] && echo "OK: TProxyStartService presente" \
            || { echo "ERROR: R8 eliminó/renombró TProxyService"; exit 1; }

      - name: Preparar clave y certificado
        env:
          KEY_B64: ${{ secrets.KEY_PK8_B64 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"

          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > key.raw
          if grep -aq "BEGIN" key.raw; then
            openssl pkcs8 -topk8 -nocrypt -inform PEM -outform DER -in key.raw -out key.pk8
          else
            openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in key.raw -out key.pk8
          fi
          rm -f key.raw

          # Certificado sin openssl (rechaza el país vacío de tu certificado)
          sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' "$GITHUB_WORKSPACE/cert.pem" \
            | grep -v -- '-----' | tr -d ' \r\n\t' | base64 -d > cert.der
          keytool -printcert -file cert.der | head -8

      - name: Alinear y firmar APK
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(cat "$RUNNER_TEMP/newapk.txt")

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --key "$RUNNER_TEMP/key.pk8" \
            --cert "$RUNNER_TEMP/cert.der" \
            --out app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk | tee "$RUNNER_TEMP/verify.txt"

          # La firma tiene que ser la tuya (SHA-256 de tu certificado original)
          grep -qi "8250277addbb48d5db5424319beb1426c9601b510b0e3f9f9092d30e53cdca25" "$RUNNER_TEMP/verify.txt" \
            || { echo "ERROR: la firma NO es la de tu certificado original"; exit 1; }
          echo "OK: firma original (el_tioNel)"

      - name: Limpiar claves
        if: always()
        run: rm -f "$RUNNER_TEMP"/key.pk8 "$RUNNER_TEMP"/cert.der

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: apk-firmado
          path: app-release-signed.apk

      - name: Publicar Release (opcional)
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          set -eo pipefail
          # La etiqueta debe ser igual al versionName de la app (1.24.<n>): así el actualizador
          # sabe si la versión del Release es más nueva que la instalada.
          TAG="v1.24.${GITHUB_RUN_NUMBER}"
          # Un solo APK por Release: el actualizador de la app descarga ese.
          cp app-release-signed.apk "Conecta_1_24_${GITHUB_RUN_NUMBER}.apk"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" "Conecta_1_24_${GITHUB_RUN_NUMBER}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "${NOTAS:-Build automático}" --latest
