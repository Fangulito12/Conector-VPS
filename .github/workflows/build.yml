name: Build y firma APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir proyecto
        run: |
          set -eo pipefail
          unzip -q proyecto.zip -d src_proyecto
          find src_proyecto -maxdepth 3 | head -60

      - name: Buscar cómo actualiza la app
        run: |
          echo "== URLs de GitHub / actualización =="
          grep -rnE "api\.github\.com|raw\.githubusercontent|github\.com/[^\"' ]+|releases/latest|version\.json|update" \
            --include=*.java --include=*.kt --include=*.xml --include=*.json --include=*.gradle \
            src_proyecto 2>/dev/null | grep -v "/build/" | head -40 || true
          echo "== Versión actual =="
          grep -rnE "versionCode|versionName" --include=build.gradle --include=build.gradle.kts src_proyecto | head || true

      - name: Desactivar R8 / minificación
        run: |
          set -eo pipefail
          FILES=$(find src_proyecto \( -name build.gradle -o -name build.gradle.kts \) -not -path "*/node_modules/*")
          for f in $FILES; do
            sed -i -E \
              -e 's/(minifyEnabled[[:space:]]*=?[[:space:]]*)true/\1false/g' \
              -e 's/(isMinifyEnabled[[:space:]]*=?[[:space:]]*)true/\1false/g' \
              -e 's/(shrinkResources[[:space:]]*=?[[:space:]]*)true/\1false/g' \
              -e 's/(isShrinkResources[[:space:]]*=?[[:space:]]*)true/\1false/g' \
              "$f"
          done
          echo "== Estado final =="
          grep -rniE "minify|shrinkResources" $FILES || echo "(no hay opciones de minify en los build.gradle)"

      - name: Compilar APK sin firmar
        run: |
          set -eo pipefail
          SETTINGS=$(find src_proyecto \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no hay settings.gradle en el zip."; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "$DIR" > "$RUNNER_TEMP/projdir.txt"
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Ver librerías nativas del APK
        run: |
          DIR=$(cat "$RUNNER_TEMP/projdir.txt")
          APK=$(find "$DIR" -path "*outputs/apk/release*" -name "*.apk" | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "\.so|classes" || echo "sin .so"

      - name: Preparar clave y certificado
        env:
          KEY_B64: ${{ secrets.KEY_PK8_B64 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"

          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > key.raw
          if grep -aq "BEGIN" key.raw; then
            openssl pkcs8 -topk8 -nocrypt -inform PEM -outform DER -in key.raw -out key.pk8
          else
            openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in key.raw -out key.pk8
          fi
          rm -f key.raw

          sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' "$GITHUB_WORKSPACE/cert.pem" \
            | grep -v -- '-----' | tr -d ' \r\n\t' | base64 -d > cert.der

          echo "== Certificado =="
          keytool -printcert -file cert.der | head -8

      - name: Alinear y firmar APK
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          DIR=$(cat "$RUNNER_TEMP/projdir.txt")
          UNSIGNED=$(find "$DIR" -path "*outputs/apk/release*" -name "*.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "ERROR: no se encontró ningún APK de release."
            find "$DIR" -name "*.apk"; exit 1
          fi

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --key "$RUNNER_TEMP/key.pk8" \
            --cert "$RUNNER_TEMP/cert.der" \
            --out app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk

      - name: Limpiar claves
        if: always()
        run: rm -f "$RUNNER_TEMP"/key.pk8 "$RUNNER_TEMP"/cert.der

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: apk-firmado
          path: app-release-signed.apk

      - name: Publicar Release (para el actualizador)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          VN=$(grep -rhoE "versionName[[:space:]]*=?[[:space:]]*[\"'][^\"']+[\"']" \
                 --include=build.gradle --include=build.gradle.kts src_proyecto \
               | head -1 | sed -E "s/.*[\"']([^\"']+)[\"']/\1/")
          if [ -n "$VN" ]; then TAG="v$VN"; else TAG="v$(date +%Y.%m.%d-%H%M)"; fi
          echo "Tag del release: $TAG"

          # Si ya existe un release con ese tag, se reemplaza
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true

          gh release create "$TAG" app-release-signed.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Build automático" \
            --latest
