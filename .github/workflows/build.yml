name: Build y firma APK

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar Release para el actualizador"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Instalar NDK y CMake
        run: |
          set -eo pipefail
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null || echo "(no se pudo instalar NDK, se sigue igual)"

      - name: Descomprimir proyecto
        run: |
          set -eo pipefail
          unzip -q proyecto.zip -d src_proyecto
          find src_proyecto -maxdepth 3 | head -60

      - name: Diagnóstico del código nativo en el proyecto
        run: |
          echo "== Archivos de build nativo =="
          find src_proyecto \( -name "Android.mk" -o -name "Application.mk" -o -name "CMakeLists.txt" -o -name ".gitmodules" -o -name "*.so" \) | head -30
          echo "== Carpetas jni / jniLibs / hev =="
          find src_proyecto -type d \( -name jni -o -name jniLibs -o -name "hev-*" \) | head -20
          echo "== Contenido de las carpetas hev (¿vacías?) =="
          for d in $(find src_proyecto -type d -name "hev-*" | head -5); do
            echo "$d -> $(find "$d" -type f | wc -l) archivos"
          done
          echo "== Config nativa en gradle =="
          grep -rnE "externalNativeBuild|ndkBuild|cmake|abiFilters|jniLibs|useLegacyPackaging|ndkVersion" \
            --include=build.gradle --include=build.gradle.kts src_proyecto | head -20 || true
          echo "== Cómo actualiza la app =="
          grep -rnE "api\.github\.com|raw\.githubusercontent|releases/latest|version\.json" \
            --include=*.java --include=*.kt --include=*.xml --include=*.json \
            src_proyecto 2>/dev/null | grep -v "/build/" | head -15 || true
          echo "== Versión actual =="
          grep -rnE "versionCode|versionName" --include=build.gradle --include=build.gradle.kts src_proyecto | head || true

      - name: Compilar APK sin firmar
        run: |
          set -eo pipefail
          SETTINGS=$(find src_proyecto \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no hay settings.gradle en el zip."; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "$DIR" > "$RUNNER_TEMP/projdir.txt"
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Comparar .so del APK nuevo con vieja.apk y reparar faltantes
        run: |
          set -eo pipefail
          DIR=$(cat "$RUNNER_TEMP/projdir.txt")
          NEW=$(realpath "$(find "$DIR" -path "*outputs/apk/release*" -name "*.apk" | head -1)")
          echo "$NEW" > "$RUNNER_TEMP/newapk.txt"
          echo "APK nuevo: $NEW"

          echo "== .so en el APK NUEVO =="
          unzip -l "$NEW" | awk '{print $4}' | grep '\.so$' | sort | tee "$RUNNER_TEMP/new_so.txt" || echo "NINGUNO"

          if [ ! -f vieja.apk ]; then
            echo "(No hay vieja.apk en la raíz del repo: no se puede reparar)"; exit 0
          fi

          echo "== .so en vieja.apk =="
          unzip -l vieja.apk | awk '{print $4}' | grep '\.so$' | sort | tee "$RUNNER_TEMP/old_so.txt" || echo "NINGUNO"

          # .so que tiene la vieja y le faltan a la nueva
          comm -23 "$RUNNER_TEMP/old_so.txt" "$RUNNER_TEMP/new_so.txt" > "$RUNNER_TEMP/missing_so.txt" || true
          echo "== .so FALTANTES en el nuevo =="
          cat "$RUNNER_TEMP/missing_so.txt" || true

          if [ -s "$RUNNER_TEMP/missing_so.txt" ]; then
            mkdir -p "$RUNNER_TEMP/oldx"
            unzip -q vieja.apk 'lib/*' -d "$RUNNER_TEMP/oldx"
            ( cd "$RUNNER_TEMP/oldx" && xargs -a "$RUNNER_TEMP/missing_so.txt" zip -0 "$NEW" )
            echo "== Reparado: .so copiados de vieja.apk al APK nuevo =="
            unzip -l "$NEW" | awk '{print $4}' | grep '\.so$' | sort
          else
            echo "No faltan .so respecto a vieja.apk."
          fi

      - name: Preparar clave y certificado
        env:
          KEY_B64: ${{ secrets.KEY_PK8_B64 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"

          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > key.raw
          if grep -aq "BEGIN" key.raw; then
            openssl pkcs8 -topk8 -nocrypt -inform PEM -outform DER -in key.raw -out key.pk8
          else
            openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in key.raw -out key.pk8
          fi
          rm -f key.raw

          sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' "$GITHUB_WORKSPACE/cert.pem" \
            | grep -v -- '-----' | tr -d ' \r\n\t' | base64 -d > cert.der

          echo "== Certificado =="
          keytool -printcert -file cert.der | head -8

      - name: Alinear y firmar APK
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(cat "$RUNNER_TEMP/newapk.txt")

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --key "$RUNNER_TEMP/key.pk8" \
            --cert "$RUNNER_TEMP/cert.der" \
            --out app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk

          echo "== .so en el APK FINAL =="
          unzip -l app-release-signed.apk | awk '{print $4}' | grep '\.so$' | sort || echo "NINGUNO"

      - name: Limpiar claves
        if: always()
        run: rm -f "$RUNNER_TEMP"/key.pk8 "$RUNNER_TEMP"/cert.der

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: apk-firmado
          path: app-release-signed.apk

      - name: Publicar Release (solo si lo pedís a mano)
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          VN=$(grep -rhoE "versionName[[:space:]]*=?[[:space:]]*[\"'][^\"']+[\"']" \
                 --include=build.gradle --include=build.gradle.kts src_proyecto \
               | head -1 | sed -E "s/.*[\"']([^\"']+)[\"']/\1/")
          if [ -n "$VN" ]; then TAG="v$VN"; else TAG="v$(date +%Y.%m.%d-%H%M)"; fi
          echo "Tag del release: $TAG"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" app-release-signed.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Build automático" \
            --latest
