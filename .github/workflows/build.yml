name: Build y firma APK

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar Release para el actualizador"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir proyecto
        run: |
          set -eo pipefail
          unzip -q proyecto.zip -d src_proyecto
          find src_proyecto -maxdepth 3 | head -60

      - name: Copiar librerías nativas del APK que funciona
        run: |
          set -eo pipefail
          echo "== Archivos en la raíz del repo =="
          ls -la

          BASE=$(find . -type f -iname "*.apk" \
                   -not -path "./src_proyecto/*" -not -path "./.git/*" \
                   -not -name "app-release-signed.apk" | head -1)
          if [ -z "$BASE" ]; then
            echo "ERROR: no hay ningún .apk en el repo."
            echo "Subí Conecta_HWID_1_24_67.apk desde GitHub (Add file > Upload files) y volvé a ejecutar."
            echo "== Todos los archivos del repo (sin .git) =="
            find . -type f -not -path "./.git/*" -not -path "./src_proyecto/*" | head -50
            exit 1
          fi
          echo "APK base: $BASE"
          ls -l "$BASE"

          MANIFEST=$(find src_proyecto -path "*src/main/AndroidManifest.xml" -not -path "*/build/*" | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "ERROR: no se encontró src/main/AndroidManifest.xml en el proyecto."; exit 1
          fi
          MAIN=$(dirname "$MANIFEST")
          echo "Módulo principal: $MAIN"

          mkdir -p "$RUNNER_TEMP/basex"
          unzip -q "$BASE" 'lib/*' -d "$RUNNER_TEMP/basex" || {
            echo "ERROR: ese APK no contiene carpeta lib/ (no es el que funciona o está dañado)."; exit 1; }
          mkdir -p "$MAIN/jniLibs"
          cp -r "$RUNNER_TEMP/basex/lib/." "$MAIN/jniLibs/"

          echo "== jniLibs del proyecto =="
          find "$MAIN/jniLibs" -type f | sort

          echo "== Configuración nativa del proyecto (informativo) =="
          grep -rnE "abiFilters|jniLibs|useLegacyPackaging|externalNativeBuild" \
            --include=build.gradle --include=build.gradle.kts src_proyecto || echo "(sin configuración especial)"

      - name: Buscar cómo actualiza la app (informativo)
        run: |
          grep -rnE "api\.github\.com|raw\.githubusercontent|releases/latest|version\.json" \
            --include=*.java --include=*.kt --include=*.xml --include=*.json \
            src_proyecto 2>/dev/null | grep -v "/build/" | head -15 || true
          echo "== Versión =="
          grep -rnE "versionCode|versionName" --include=build.gradle --include=build.gradle.kts src_proyecto | head || true

      - name: Compilar APK sin firmar
        run: |
          set -eo pipefail
          SETTINGS=$(find src_proyecto \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no hay settings.gradle en el zip."; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "$DIR" > "$RUNNER_TEMP/projdir.txt"
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Verificar que el APK nuevo trae los .so
        run: |
          set -eo pipefail
          DIR=$(cat "$RUNNER_TEMP/projdir.txt")
          NEW=$(find "$DIR" -path "*outputs/apk/release*" -name "*.apk" | head -1)
          if [ -z "$NEW" ]; then
            echo "ERROR: no se encontró ningún APK de release."; find "$DIR" -name "*.apk"; exit 1
          fi
          NEW=$(realpath "$NEW")
          echo "$NEW" > "$RUNNER_TEMP/newapk.txt"
          echo "APK nuevo: $NEW"
          echo "== .so en el APK nuevo =="
          unzip -l "$NEW" | awk '{print $4}' | grep '\.so$' | sort | tee "$RUNNER_TEMP/new_so.txt"
          if ! grep -q "libhev-socks5-tunnel.so" "$RUNNER_TEMP/new_so.txt"; then
            echo "ERROR: el APK nuevo no trae libhev-socks5-tunnel.so"; exit 1
          fi

      - name: Preparar clave y certificado
        env:
          KEY_B64: ${{ secrets.KEY_PK8_B64 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"

          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > key.raw
          if grep -aq "BEGIN" key.raw; then
            openssl pkcs8 -topk8 -nocrypt -inform PEM -outform DER -in key.raw -out key.pk8
          else
            openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in key.raw -out key.pk8
          fi
          rm -f key.raw

          sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' "$GITHUB_WORKSPACE/cert.pem" \
            | grep -v -- '-----' | tr -d ' \r\n\t' | base64 -d > cert.der

          echo "== Certificado =="
          keytool -printcert -file cert.der | head -8

      - name: Alinear y firmar APK
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(cat "$RUNNER_TEMP/newapk.txt")

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --key "$RUNNER_TEMP/key.pk8" \
            --cert "$RUNNER_TEMP/cert.der" \
            --out app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk

          echo "== .so en el APK FINAL =="
          unzip -l app-release-signed.apk | awk '{print $4}' | grep '\.so$' | sort

      - name: Limpiar claves
        if: always()
        run: rm -f "$RUNNER_TEMP"/key.pk8 "$RUNNER_TEMP"/cert.der

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: apk-firmado
          path: app-release-signed.apk

      - name: Publicar Release (solo si lo pedís a mano)
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          VN=$(grep -rhoE "versionName[[:space:]]*=?[[:space:]]*[\"'][^\"']+[\"']" \
                 --include=build.gradle --include=build.gradle.kts src_proyecto \
               | head -1 | sed -E "s/.*[\"']([^\"']+)[\"']/\1/")
          if [ -n "$VN" ]; then TAG="v$VN"; else TAG="v$(date +%Y.%m.%d-%H%M)"; fi
          echo "Tag del release: $TAG"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" app-release-signed.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Build automático" \
            --latest
