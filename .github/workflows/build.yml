name: Build y firma APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir proyecto
        run: |
          set -eo pipefail
          unzip -q proyecto.zip -d src_proyecto
          find src_proyecto -maxdepth 3 | head -60

      - name: Compilar APK sin firmar
        run: |
          set -eo pipefail
          SETTINGS=$(find src_proyecto \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no hay settings.gradle en el zip."; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "$DIR" > "$RUNNER_TEMP/projdir.txt"
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Preparar clave y certificado original
        env:
          KEY_B64: ${{ secrets.KEY_PK8_B64 }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"

          # Clave -> PKCS#8 DER sin cifrar
          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > key.raw
          if grep -aq "BEGIN" key.raw; then
            openssl pkcs8 -topk8 -nocrypt -inform PEM -outform DER -in key.raw -out key.pk8
          else
            openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in key.raw -out key.pk8
          fi
          rm -f key.raw

          # Certificado original, subido al repo como cert.pem
          if [ ! -f "$GITHUB_WORKSPACE/cert.pem" ]; then
            echo "ERROR: falta cert.pem en la raíz del repo."; exit 1
          fi
          if grep -aq "BEGIN CERTIFICATE" "$GITHUB_WORKSPACE/cert.pem"; then
            openssl x509 -in "$GITHUB_WORKSPACE/cert.pem" -out cert.pem
          else
            openssl x509 -inform DER -in "$GITHUB_WORKSPACE/cert.pem" -out cert.pem
          fi

          echo "== Certificado =="
          openssl x509 -in cert.pem -noout -subject -enddate -fingerprint -sha256

          # Verificar que la clave corresponde al certificado
          K=$(openssl pkey -inform DER -in key.pk8 -pubout -outform DER | sha256sum)
          C=$(openssl x509 -in cert.pem -pubkey -noout | openssl pkey -pubin -pubout -outform DER | sha256sum)
          if [ "$K" = "$C" ]; then
            echo "Clave y certificado COINCIDEN"
          else
            echo "ERROR: la clave no corresponde a este certificado."; exit 1
          fi

      - name: Alinear y firmar APK
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          DIR=$(cat "$RUNNER_TEMP/projdir.txt")
          UNSIGNED=$(find "$DIR" -path "*outputs/apk/release*" -name "*.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "ERROR: no se encontró ningún APK de release."
            find "$DIR" -name "*.apk"; exit 1
          fi

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --key "$RUNNER_TEMP/key.pk8" \
            --cert "$RUNNER_TEMP/cert.pem" \
            --out app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" verify --verbose --print-certs app-release-signed.apk

      - name: Limpiar claves
        if: always()
        run: rm -f "$RUNNER_TEMP"/key.pk8 "$RUNNER_TEMP"/cert.pem

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: apk-firmado
          path: app-release-signed.apk
