# ---------------------------------------------------------------------------
# Pasos para tu flujo de GitHub Actions (.github/workflows/<tu-archivo>.yml)
# Sirven para que cada compilacion quede publicada como "Release"; de ahi la app
# se entera de la version nueva y descarga el APK.
# ---------------------------------------------------------------------------

# 1) En el job que compila, agrega estos permisos (a la altura de runs-on):
    permissions:
      contents: write

# 2) Al final del job, DESPUES de compilar el APK, agrega este paso.
#    - tag_name debe ser "v1.24." + numero de ejecucion (igual que versionName de la app).
#    - El nombre de cada APK debe contener "hwid" (version clientes) o "generador"
#      (tu version). Ajusta las rutas de "files" a donde tu flujo deja los APK.
      - name: Publicar Release (actualizador de la app)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.24.${{ github.run_number }}
          name: Conecta v1.24.${{ github.run_number }}
          body: |
            Novedades de esta version (escribe aqui lo que cambia).
          files: |
            Conecta-HWID.apk
            Conecta-Generador.apk
